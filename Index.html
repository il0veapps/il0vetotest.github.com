<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Web Portal</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0c0c0c;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Top Navigation Header */
        .nav-header {
            height: 50px;
            background-color: #181818;
            border-bottom: 2px solid #ff1e27;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            color: #ffffff;
        }
        .logo {
            font-weight: bold;
            color: #ff1e27;
            font-size: 18px;
            letter-spacing: 1px;
        }
        .status-txt {
            font-size: 12px;
            color: #888;
        }
        .refresh-btn {
            background-color: #ff1e27;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .refresh-btn:hover {
            background-color: #d6151c;
        }
        /* Full Screen Game Box */
        .game-frame-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100% - 50px);
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Header Interface -->
    <div class="nav-header">
        <span class="logo">🟥 ROBLOX PORTAL</span>
        <span class="status-txt" id="loading-status">System Standing By...</span>
        <button class="refresh-btn" onclick="reloadRoblox()">Force Reload</button>
    </div>

    <!-- Active Roblox Cloud Container -->
    <div class="game-frame-container">
        <iframe 
            id="roblox-screen" 
            src="https://now.gg/games/roblox-mini-games.html" 
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock">
        </iframe>
    </div>

    <script>
        // Visual indicator that client is processing
        window.addEventListener('load', () => {
            document.getElementById('loading-status').innerText = "Streaming online engine client...";
        });

        function reloadRoblox() {
            const frame = document.getElementById('roblox-screen');
            frame.src = frame.src;
            document.getElementById('loading-status').innerText = "Re-establishing connection loop...";
        }
    </script>

</body>
</html>
